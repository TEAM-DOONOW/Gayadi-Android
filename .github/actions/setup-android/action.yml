name: Set up Android build
description: Configure JDK, Android SDK and Gradle for Gayadi
inputs:
  cache-disabled:
    description: Disable cache restore/save for builds with production configuration
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
    - name: Install app and library SDKs
      shell: bash
      run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0'
    - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      with:
        cache-provider: basic
        cache-disabled: ${{ inputs.cache-disabled }}
