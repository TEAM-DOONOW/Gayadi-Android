name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate pull request branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          BRANCH_PATTERN='^(feat|fix|docs|style|refactor|test|chore|add|ci|build|perf|design)/#[0-9]+$'
          if [[ ! "$BRANCH_NAME" =~ $BRANCH_PATTERN ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo 'Expected format: <type>/#<issue-number> (example: fix/#93)'
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run Android quality gates
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
