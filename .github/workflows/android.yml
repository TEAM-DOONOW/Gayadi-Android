name: Android CI

on:
  pull_request:
    branches: [main, stg]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate pull request branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          BRANCH_PATTERN='^(feat|fix|docs|style|refactor|test|chore|add|ci|build|perf|design)/#[0-9]+$'
          if [[ "$BRANCH_NAME" == stg && "$BASE_BRANCH" == main ]] || [[ "$BRANCH_NAME" == main && "$BASE_BRANCH" == stg ]]; then
            exit 0
          fi
          if [[ ! "$BRANCH_NAME" =~ $BRANCH_PATTERN ]]; then
            echo 'Expected format: <type>/#<issue-number> (example: fix/#93)'
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Test release version and retry rules
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  unit-test:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Prepare placeholder build configuration
        run: |
          cp config/dev.properties.example config/dev.properties
          cp config/prod.properties.example config/prod.properties
      - name: Run app, Android library and domain unit tests
        run: ./gradlew --no-daemon :app:testDevDebugUnitTest testDebugUnitTest :domain:test
      - name: Save unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  lint-build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
      - name: Prepare placeholder build configuration
        run: |
          cp config/dev.properties.example config/dev.properties
          cp config/prod.properties.example config/prod.properties
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDevDebug lintDebug
      - name: Build dev APK
        run: ./gradlew --no-daemon :app:assembleDevDebug
      - name: Save lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*'
          retention-days: 7
          if-no-files-found: ignore
      - name: Save validation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-validation-apk
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          retention-days: 3
          if-no-files-found: error

  ci-result:
    if: always()
    needs: [validate, unit-test, lint-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all quality gates to succeed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TEST_RESULT: ${{ needs.unit-test.result }}
          BUILD_RESULT: ${{ needs.lint-build.result }}
        run: |
          [[ "$VALIDATE_RESULT" == success && "$TEST_RESULT" == success && "$BUILD_RESULT" == success ]]
